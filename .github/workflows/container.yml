name: Test, build and publish to GHCR

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Java tests and package
        run: mvn -B -ntp clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: java-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  container:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: inventory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test container and Postman scenarios
        run: bash scripts/verify-container.sh
      - name: Upload container reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-test-reports
          path: |
            target/container.log
            target/container-postman.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Export verified image for publication
        if: (contains(fromJSON('["refs/heads/dev","refs/heads/qa","refs/heads/main"]'), github.ref) || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        run: docker save inventory:ci | gzip > target/inventory-image.tar.gz
      - name: Upload verified image
        if: (contains(fromJSON('["refs/heads/dev","refs/heads/qa","refs/heads/main"]'), github.ref) || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inventory-image
          path: target/inventory-image.tar.gz
          retention-days: 1

  publish:
    needs: container
    if: (contains(fromJSON('["refs/heads/dev","refs/heads/qa","refs/heads/main"]'), github.ref) || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: inventory-image
          path: image
      - name: Load image and resolve package name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          docker load -i image/inventory-image.tar.gz
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Generate tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'branch' }}
            type=sha,format=long,prefix=${{ github.ref_type == 'tag' && 'release' || github.ref_name }}-sha-
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag inventory:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  # Future Kubernetes deployment: documentation only; no executable deploy job.
  # Add it after publish, using a protected GitHub environment named production.
  # Expected secrets: KUBE_CONFIG_B64, DB_URL, DB_USERNAME, DB_PASSWORD.
  # For private GHCR packages: GHCR_PULL_USERNAME and GHCR_PULL_TOKEN.
  # Expected variables: K8S_NAMESPACE, K8S_CONTEXT, K8S_DEPLOYMENT, K8S_OVERLAY.
  # Deploy the published image by digest after database migrations are validated.
  # Procedure and remaining application changes: docs/PRODUCTION.md.
